[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curvelab"
version = "0.11.3"
description = "Data Plotter & Curve Fitter: a GUI for lmfit"
readme = "README.md"
authors = [{ name = "Giuseppe Vacanti", email = "giuseppe@vacanti.org" }]
keywords = ["curve fitting", "lmfit", "data analysis", "plotting"]
classifiers = [
      "Development Status :: 4 - Beta",
      "Intended Audience :: Science/Research",
      "Programming Language :: Python :: 3",
      "Programming Language :: Python :: 3.10",
      "Programming Language :: Python :: 3.11",
      "Programming Language :: Python :: 3.12",
      "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
license = "BSD-3-Clause"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "lmfit",
    # Imported directly by CurveLab (also lmfit core deps, listed for clarity).
    "asteval",
    "uncertainties",
    # Fitting stack: numdifftools gives uncertainties for scalar/global
    # methods, emcee provides the MCMC method, tqdm its progress bars. These
    # are optional extras of lmfit, so they are required explicitly here.
    "numdifftools",
    "emcee",
    "tqdm",
]
license-files = ["LICENSE"]
[project.urls]
  Homepage      = "https://github.com/cosine-eu/curvelab"
  Documentation = "https://github.com/cosine-eu/curvelab/blob/main/docs/user_manual.md"
  Source        = "https://github.com/cosine-eu/curvelab"
  Issues        = "https://github.com/cosine-eu/curvelab/issues"


[project.optional-dependencies]
notebook = ["ipywidgets", "ipympl"]
excel = ["openpyxl"]
ods = ["odfpy"]
hdf5 = ["tables"]
parquet = ["pyarrow"]
# ODR is a fit method whose backend (odrpack) ships Fortran-built wheels that
# aren't available on every platform, so it stays optional to keep installs
# from failing where no wheel exists.
odr = ["odrpack"]
test = ["pytest", "pytest-cov", "pytest-timeout"]

[project.scripts]
curvelab = "curvelab.app:CurveLabApp.launch"

[tool.setuptools.packages.find]
include = ["curvelab*"]

[tool.setuptools.package-data]
curvelab = ["*.png", "*.svg"]

[tool.pytest.ini_options]
addopts = "--cov=curvelab --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["curvelab"]
# GUI modules need a live Tk/matplotlib event loop the unit tests don't
# spin up, so they're excluded to keep the reported figure meaningful for
# the GUI-agnostic core (fit_manager, data_manager, models, preprocessing,
# session, workspace).
omit = [
    "curvelab/app.py",
    "curvelab/app_analysis_handlers.py",
    "curvelab/app_data_tools.py",
    "curvelab/app_fit_handlers.py",
    "curvelab/app_menu.py",
    "curvelab/app_plotting.py",
    "curvelab/app_series.py",
    "curvelab/app_workspace.py",
    "curvelab/notebook.py",
    "curvelab/plot_manager.py",
    "curvelab/ui_panels.py",
    "curvelab/ui_common.py",
    "curvelab/ui_dialogs_analysis.py",
    "curvelab/ui_dialogs_data.py",
    "curvelab/__main__.py",
]

[tool.coverage.report]
show_missing = true
