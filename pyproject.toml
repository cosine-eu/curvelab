[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curvelab"
version = "0.9.2"
description = "Data Plotter & Curve Fitter"
requires-python = ">=3.10"
license = "BSD-3-Clause"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "lmfit",
]

[project.optional-dependencies]
notebook = ["ipywidgets", "ipympl"]
excel = ["openpyxl"]
ods = ["odfpy"]
hdf5 = ["tables"]
odr = ["odrpack"]

[project.scripts]
curvelab = "curvelab.app:CurveLabApp.launch"

[tool.setuptools.packages.find]
include = ["curvelab*"]

[tool.setuptools.package-data]
curvelab = ["*.png", "*.svg"]
