<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="curve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
    <linearGradient id="curve2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#4e9af1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="60" y1="60" x2="60" y2="300"/>
    <line x1="120" y1="60" x2="120" y2="300"/>
    <line x1="180" y1="60" x2="180" y2="300"/>
    <line x1="240" y1="60" x2="240" y2="300"/>
    <line x1="300" y1="60" x2="300" y2="300"/>
    <line x1="340" y1="60" x2="340" y2="300"/>
    <line x1="60" y1="100" x2="340" y2="100"/>
    <line x1="60" y1="150" x2="340" y2="150"/>
    <line x1="60" y1="200" x2="340" y2="200"/>
    <line x1="60" y1="250" x2="340" y2="250"/>
    <line x1="60" y1="300" x2="340" y2="300"/>
  </g>

  <!-- Axes -->
  <line x1="60" y1="300" x2="345" y2="300" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
  <line x1="60" y1="55" x2="60" y2="305" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Confidence band -->
  <path d="M70,235 Q120,200 160,120 Q200,165 240,175 Q280,140 330,95
           L330,135 Q280,180 240,215 Q200,210 160,170 Q120,250 70,275 Z"
        fill="#e94560" fill-opacity="0.08"/>

  <!-- Fit curve (smooth) -->
  <path d="M70,255 Q120,225 160,145 Q200,190 240,195 Q280,160 330,115"
        fill="none" stroke="url(#curve)" stroke-width="3" stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Second component curve (dashed) -->
  <path d="M70,270 Q120,260 160,200 Q200,240 240,250 Q280,240 330,220"
        fill="none" stroke="url(#curve2)" stroke-width="1.5" stroke-dasharray="6,4"
        stroke-linecap="round" opacity="0.6"/>

  <!-- Data points with error bars -->
  <g stroke="#4e9af1" stroke-width="1" fill="#4e9af1" opacity="0.9">
    <!-- Point 1 -->
    <line x1="80" y1="245" x2="80" y2="265"/>
    <line x1="76" y1="245" x2="84" y2="245"/>
    <line x1="76" y1="265" x2="84" y2="265"/>
    <circle cx="80" cy="258" r="4"/>

    <!-- Point 2 -->
    <line x1="105" y1="225" x2="105" y2="250"/>
    <line x1="101" y1="225" x2="109" y2="225"/>
    <line x1="101" y1="250" x2="109" y2="250"/>
    <circle cx="105" cy="235" r="4"/>

    <!-- Point 3 -->
    <line x1="130" y1="180" x2="130" y2="210"/>
    <line x1="126" y1="180" x2="134" y2="180"/>
    <line x1="126" y1="210" x2="134" y2="210"/>
    <circle cx="130" cy="192" r="4"/>

    <!-- Point 4 -->
    <line x1="155" y1="130" x2="155" y2="160"/>
    <line x1="151" y1="130" x2="159" y2="130"/>
    <line x1="151" y1="160" x2="159" y2="160"/>
    <circle cx="155" cy="150" r="4"/>

    <!-- Point 5 (peak) -->
    <line x1="170" y1="120" x2="170" y2="150"/>
    <line x1="166" y1="120" x2="174" y2="120"/>
    <line x1="166" y1="150" x2="174" y2="150"/>
    <circle cx="170" cy="138" r="4"/>

    <!-- Point 6 -->
    <line x1="195" y1="175" x2="195" y2="205"/>
    <line x1="191" y1="175" x2="199" y2="175"/>
    <line x1="191" y1="205" x2="199" y2="205"/>
    <circle cx="195" cy="185" r="4"/>

    <!-- Point 7 -->
    <line x1="220" y1="180" x2="220" y2="210"/>
    <line x1="216" y1="180" x2="224" y2="180"/>
    <line x1="216" y1="210" x2="224" y2="210"/>
    <circle cx="220" cy="200" r="4"/>

    <!-- Point 8 -->
    <line x1="250" y1="175" x2="250" y2="205"/>
    <line x1="246" y1="175" x2="254" y2="175"/>
    <line x1="246" y1="205" x2="254" y2="205"/>
    <circle cx="250" cy="188" r="4"/>

    <!-- Point 9 -->
    <line x1="280" y1="145" x2="280" y2="175"/>
    <line x1="276" y1="145" x2="284" y2="145"/>
    <line x1="276" y1="175" x2="284" y2="175"/>
    <circle cx="280" cy="155" r="4"/>

    <!-- Point 10 -->
    <line x1="310" y1="110" x2="310" y2="140"/>
    <line x1="306" y1="110" x2="314" y2="110"/>
    <line x1="306" y1="140" x2="314" y2="140"/>
    <circle cx="310" cy="120" r="4"/>

    <!-- Point 11 (outlier - slightly off) -->
    <circle cx="140" cy="170" r="3.5" fill="#ff6b6b" stroke="#ff6b6b" opacity="0.5"/>
  </g>

  <!-- Text: CurveLab -->
  <text x="200" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="42" font-weight="bold" fill="#ffffff" letter-spacing="2">
    <tspan fill="#e94560">Curve</tspan><tspan fill="#4e9af1">Lab</tspan>
  </text>

  <!-- Subtitle -->
  <text x="200" y="375" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="12" fill="#ffffff" fill-opacity="0.5" letter-spacing="3">
    INTERACTIVE CURVE FITTING
  </text>
</svg>
